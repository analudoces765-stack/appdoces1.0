/* regras de preço: lucro é % do PREÇO DE VENDA (30% de lucro = de cada R$100 vendidos, R$30 sobram). Taxas (cartão/imposto) saem do preço também.
   Preço = custo ÷ (1 − lucro% − taxas%). O custo inclui o rateio dos custos fixos (Configurações), se informado. */
const taxa=()=>num(CFG.taxa_pct),rateio=()=>num(CFG.producao_mes)>0?num(CFG.custo_fixo_mes)/num(CFG.producao_mes):0;
const cT=p=>{const b=num(p.custo)+num(p.custo_extra);return b>0?b+rateio():0};   // custo total de 1 unidade
const sugeridoDe=(cus,m)=>{const d=1-(num(m)+taxa())/100;return d>0&&cus>0?Math.ceil(cus/d*100)/100:null};
const sugerido=p=>sugeridoDe(cT(p),p.margem);
const margemDe=(pr,cus)=>num(pr)>0?(num(pr)*(1-taxa()/100)-cus)/num(pr)*100:null;
const margemReal=p=>margemDe(p.preco,cT(p));
const abaixo=p=>{const m=margemReal(p);return m!=null&&cT(p)>0&&m<num(p.margem)-0.5};

/* ===== 1 · zero cache: recalcula custos a partir dos insumos atuais e grava no banco ===== */
let xBusy=false,xQuiet=0,xGoAt=0;const xLast={};
async function xSet(tb,id,k,val,cur){if(Math.abs(val-num(cur))<=1e-6||xLast[tb+id+k]===val)return;xLast[tb+id+k]=val;xQuiet=Date.now()+4000;await sb.from(tb).update({[k]:val}).eq('id',id)}
async function xSync(){
 if(xBusy||!canW('produtos')&&!canW('insumos'))return;xBusy=true;
 try{
  const [I,P,F,CC]=await Promise.all([all('insumos'),all('produtos'),all('ficha_tecnica'),all('configuracoes')]);
  CFG={...CFG,...Object.fromEntries(CC.map(x=>[x.chave,x.valor]))};
  for(const i of I){if(num(i.qtd_embalagem)>0&&num(i.preco_embalagem)>0){const c=num(i.preco_embalagem)/num(i.qtd_embalagem);
   await xSet('insumos',i.id,'custo_unit',c,i.custo_unit)}}
  const Im=new Map(I.map(i=>[i.id,i]));
  for(const p of P){
   const tot=F.filter(f=>f.produto_id===p.id).reduce((a,f)=>{const i=Im.get(f.insumo_id);if(!i)return a;const q=convX(f.quantidade,f.unidade||i.unidade,i);return q==null?a:a+q*num(i.custo_unit)},0);
   const c=Math.round(tot/(num(p.rendimento)||1)*1e6)/1e6;
   await xSet('produtos',p.id,'custo',c,p.custo);
   if(['embalagem_total','tempo_min','tempos'].some(k=>p[k]!=null)){const ce=xExtra(p);
    await xSet('produtos',p.id,'custo_extra',ce,p.custo_extra)}}
 }catch(e){}finally{xBusy=false}}
