:root{--p:#d72c62;--bg:#fdf5f7;--bd:#f2dfe5;--ink:#34202a;--mu:#8f7480}

@media(max-width:600px){.ai-hero{padding:16px}.ai-badge{display:none}.ai-messages{max-height:calc(100vh - 370px);padding:12px}.ai-msg{max-width:94%}.ai-chat{min-height:420px}.ai-wrap{min-height:calc(100vh - 125px)}}

let aiHistory=[];let aiBusy=false;let aiInitialQuestion='';
const AI_STORAGE=()=>`analu_ia_chat_${me?.id||'visitante'}`;
function aiFormat(text){
 let s=esc(text||'');
 s=s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
 s=s.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
 return s;
}
function aiBubble(role,content){return `<div class="ai-msg ${role}">${aiFormat(content)}</div>`}
function aiRender(){
 const box=$('#aiMessages');if(!box)return;
 box.innerHTML=aiHistory.length?aiHistory.map(m=>aiBubble(m.role==='user'?'user':'assistant',m.content)).join(''):`<div class="ai-empty"><div style="font-size:34px">👩‍🍳</div><strong>Olá! Eu sou a Analu IA.</strong><p>Sou sua parceira de confeitaria: posso ensinar técnicas, desenvolver receitas, resolver problemas de preparo e ajudar a calcular custos usando os dados cadastrados no Doces da Analu.</p></div>`;
 box.scrollTop=box.scrollHeight;
}

async function aiSend(){
 const input=$('#aiInput'),send=$('#aiSend'),typing=$('#aiTyping');const question=input?.value.trim();if(!question||aiBusy)return;
 aiBusy=true;aiHistory.push({role:'user',content:question});aiHistory=aiHistory.slice(-30);localStorage.setItem(AI_STORAGE(),JSON.stringify(aiHistory));input.value='';send.disabled=true;typing.hidden=false;aiRender();
 try{
  const {data:{session},error:se}=await sb.auth.getSession();if(se||!session)throw new Error('Sua sessão expirou. Entre novamente no sistema.');
  const res=await fetch(`${SUPABASE_URL}/functions/v1/analu-ia`,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${session.access_token}`,'apikey':SUPABASE_KEY},body:JSON.stringify({messages:aiHistory.slice(-12)})});
  const payload=await res.json().catch(()=>({}));if(!res.ok)throw new Error(payload.error||payload.message||`Erro ${res.status} ao consultar a Analu IA.`);
  aiHistory.push({role:'assistant',content:payload.answer||'Não consegui gerar uma resposta agora.'});aiHistory=aiHistory.slice(-30);localStorage.setItem(AI_STORAGE(),JSON.stringify(aiHistory));
 }catch(err){aiHistory.push({role:'assistant',content:`Não consegui responder agora. ${err.message}\n\nConfira se a função analu-ia foi publicada no Supabase e se a chave GEMINI_API_KEY foi configurada.`});}
 finally{aiBusy=false;typing.hidden=true;send.disabled=false;aiRender();input.focus();}
}

  if(!c)return viewSetup();
  sb=supabase.createClient(c.u,c.k);
  sb.auth.onAuthStateChange(ev=>{if(ev==='SIGNED_OUT')viewLogin()});

async function editRow(tb,r,pre){
 const d=T[tb];await loadRefs(d);const vals={...(d.def||{}),...(r||{}),...(pre||{})},L=d.f.find(f=>f[2]==='lines');

/* ===== formulários (drawer) ===== */
function inp(f,v,lc){const [k,l,t,o]=f,val=v??'';
 if(t==='select')return `<select name="${k}">${o.map(x=>`<option ${x===val?'selected':''}>${x}</option>`).join('')}</select>`;
 if(t==='ref')return `<select name="${k}"><option value="">Selecione…</option>${(cache[o[0]]||[]).filter(x=>x.ativo!==false).map(x=>`<option value="${x.id}" ${x.id===val?'selected':''}>${esc(optLabel(o[0],x,o[1]))}</option>`).join('')}</select>`;
 if(t==='area')return `<textarea name="${k}" rows=3>${esc(val)}</textarea>`;
 if(t==='bool')return `<label class=ck><input type=checkbox name="${k}" ${v==null||v?'checked':''}> ${l}</label>`;
 const ty={money:'number',number:'number',date:'date',color:'color'}[t]||'text';
 return `<input name="${k}" type=${ty} ${ty==='number'?'step=any min=0 inputmode=decimal':''} value="${esc(val)}" ${lc?`placeholder="${l}"`:''}>`}
const ln=(f,r)=>`<div class=ln>${f[3].cols.map(c=>inp(c,r[c[0]],1)).join('')}<button type=button class=ib data-rm>${ic('x',16)}</button></div>`;
function fld(f,v){const [k,l,t,o,fl='']=f;
 if(t==='info')return `<div class=cp id="${k}"></div>`;
 if(t==='lines')return `<div class=fl><label>${l}</label><div class=lines data-l="${k}">${(v?.length?v:[{...(o.def||{})}]).map(r=>ln(f,r)).join('')}</div><button type=button class=btn-o data-add="${k}">${ic('plus',16)} Adicionar linha</button></div>`;
 if(t==='date'&&v==null&&fl.includes('today'))v=today();
 return `<div class=fl>${t==='bool'?'':`<label>${l}${fl.includes('req')?' *':''}</label>`}${inp(f,v)}</div>`}
function collect(root,fields){const o={};for(const [k,,t,op] of fields){
 if(t==='lines'){const fc=op.cols[0][0];o[k]=[...root.querySelectorAll(`[data-l="${k}"] .ln`)].map(r=>Object.fromEntries(op.cols.map(c=>{const e=r.querySelector(`[name="${c[0]}"]`);return [c[0],c[2]==='number'?num(e.value):e.value]}))).filter(x=>x[fc]);continue}
 const e=root.querySelector(`[name="${k}"]`);if(!e)continue;
 o[k]=t==='bool'?e.checked:(t==='number'||t==='money')?num(e.value):(e.value===''?null:e.value)}return o}
function open_(title,html){$('#dr').innerHTML=`<div class=dh><h3>${title}</h3><button class=ib id=dx>${ic('x')}</button></div>${html}`;document.body.classList.add('dr-open');
 const c=()=>document.body.classList.remove('dr-open');$('#dx').onclick=$('#ov').onclick=c;return c}
function panel(title,html){open_(title,`<div class=db>${html}</div>`)}
function form({title,fields,vals={},save,btn='Salvar',foot='',onInput}){
 const close=open_(title,`<form id=fm><div class=db>${fields.map(f=>fld(f,vals[f[0]])).join('')}</div><div class=df>${foot}<button type=button class=btn-o id=dc>Cancelar</button><button class=btn id=ds>${btn}</button></div></form>`);
 const fm=$('#fm');$('#dc').onclick=close;
 if(onInput){fm.oninput=fm.onchange=()=>onInput(fm);onInput(fm)}
 fm.addEventListener('click',e=>{const a=e.target.closest('[data-add]');
  if(a){const f=fields.find(x=>x[0]===a.dataset.add);fm.querySelector(`[data-l="${f[0]}"]`).insertAdjacentHTML('beforeend',ln(f,{...(f[3].def||{})}));return}
  const r=e.target.closest('[data-rm]');if(r){const b=r.closest('.lines');if(b.children.length>1)r.closest('.ln').remove();else r.closest('.ln').querySelectorAll('input,select').forEach(x=>x.value='');onInput?.(fm)}});
 fm.onsubmit=async e=>{e.preventDefault();const v=collect(fm,fields);
  for(const f of fields)if((f[4]||'').includes('req')&&(v[f[0]]==null||v[f[0]]===''))return toast(f[1]+' é obrigatório','bad');
  const b=$('#ds');b.disabled=true;const ok=await save(v);b.disabled=false;if(ok){close();toast('Salvo com sucesso');cache={};go(route)}}}

const setHtml=(el,h)=>{if(el._h!==h){el._h=h;el.innerHTML=h}};
function insLive(fm){
 const v=collect(fm,T.insumos.f.filter(f=>!(f[4]||'').includes('ro'))),el=fm.querySelector('#calc');if(!el)return;
 const q=num(v.qtd_embalagem),pr=num(v.preco_embalagem),u=v.unidade;
 if(!(q>0))return setHtml(el,'<span class=mute>Informe quanto você comprou e quanto pagou para ver o custo.</span>');
 const cu=pr/q,b=baseCusto({custo_unit:cu,unidade:u});
 setHtml(el,`<div class=cpr><span>Você pagou</span><b>${brl(pr)} por ${fmtN(q)} ${u}</b></div>`+(u==='kg'||u==='L'?`<div class=cpr><span>Custo por ${u}</span><b>${brl(cu)}</b></div>`:'')+`<div class="cpr big"><span>Custo por ${b.u}</span><b>${brl4(b.v)}</b></div>`)}
function fixUnits(fm){ /* em cada ingrediente só deixa unidades do mesmo tipo do insumo (peso, volume ou unidade) */
 fm.querySelectorAll('[data-l="ficha"] .ln').forEach(ln=>{
  const s=ln.querySelector('[name=insumo_id]'),u=ln.querySelector('[name=unidade]'),i=(cache.insumos||[]).find(x=>x.id===s?.value);if(!u||!i)return;
  const opts=UNF[FAM[i.unidade]||'un'];
  if([...u.options].map(o=>o.value).join()!==opts.join()){const prev=u.value;u.innerHTML=opts.map(o=>`<option>${o}</option>`).join('');u.value=opts.includes(prev)?prev:opts[0]}})}
function prodLive(fm){
 fixUnits(fm);
 const v=collect(fm,T.produtos.f.filter(f=>!(f[4]||'').includes('ro'))),I=cache.insumos||[],el=fm.querySelector('#calc');if(!el)return;
 let tot=0;const sem=[];
 for(const l of v.ficha){const i=I.find(x=>x.id===l.insumo_id);if(!i)continue;if(!num(i.custo_unit))sem.push(i.nome);tot+=conv(l.quantidade,l.unidade||i.unidade,i.unidade)*num(i.custo_unit)}
 const rend=num(v.rendimento)>0?num(v.rendimento):1,ing=tot/rend,ex=num(v.custo_extra),cus=ing+ex,m=num(v.margem),t=taxa(),sug=sugeridoDe(cus,m),pr=num(v.preco),real=margemDe(pr,cus);
 setHtml(el,`<div class=cpr><span>Ingredientes (por unidade)</span><b>${brl4(ing)}</b></div><div class=cpr><span>Embalagem, mão de obra e outros</span><b>${brl4(ex)}</b></div><div class=cpr><span>Custo total por unidade</span><b>${brl4(cus)}</b></div>`
  +(t?`<div class=cpr><span>Taxas sobre a venda</span><b>${fmtN(t)}%</b></div>`:'')
  +`<div class="cpr big"><span>Preço sugerido para ${fmtN(m)}% de lucro</span><b>${sug?brl(sug):'—'}</b></div>`
  +(sug?`<button type=button class=btn-o data-use="${sug}">Usar o preço sugerido</button>`:'')
  +(pr>0&&cus>0&&real!=null?`<div class=cpr style="margin-top:8px"><span>Com o preço de ${brl(pr)}, seu lucro é</span><b style="color:var(--${real<m-0.5?'ba':'ok'})">${Math.round(real)}% · ${brl(pr*(1-t/100)-cus)} por unidade</b></div>`:'')
  +(cus<=0?'<p class=hint>Adicione os ingredientes para ver o custo e o preço sugerido.</p>':'')
  +(m+t>=100?'<p class=hint style="color:var(--ba)">Lucro desejado + taxas precisam somar menos de 100%.</p>':'')
  +(sem.length?`<p class=hint style="color:var(--ba)">Sem preço cadastrado: ${esc([...new Set(sem)].join(', '))}. O custo está incompleto.</p>`:''))}
document.addEventListener('click',e=>{const b=e.target.closest('[data-use]');if(!b)return;const f=$('#fm [name=preco]');if(f){f.value=b.dataset.use;f.dispatchEvent(new Event('input',{bubbles:true}))}});

async function concluirProd(r){
 const [F,I,P]=await Promise.all([sb.from('ficha_tecnica').select('*').eq('produto_id',r.produto_id).then(x=>x.data||[]),all('insumos'),all('produtos')]);
 const p=P.find(x=>x.id===r.produto_id),rend=num(p?.rendimento)||1,I2=new Map(I.map(i=>[i.id,i]));
 if(!F.length&&!confirm('Esta receita não tem ingredientes cadastrados, então nenhum insumo será baixado.\nConcluir mesmo assim?'))return;
 const falta=F.map(f=>{const i=I2.get(f.insumo_id);if(!i)return null;const need=conv(f.quantidade,f.unidade||i.unidade,i.unidade)*num(r.quantidade)/rend;return need>num(i.quantidade)+1e-9?`• ${i.nome}: precisa de ${fmtN(need)} ${i.unidade}, tem ${fmtN(i.quantidade)}`:null}).filter(Boolean);
 if(falta.length&&!confirm('Faltam insumos para esta produção:\n'+falta.join('\n')+'\n\nConcluir mesmo assim? O estoque desses itens ficará negativo.'))return;
 upd('ordens_producao',r.id,{status:'Concluída'},'Produção concluída — insumos baixados e estoque atualizado')}

/* ===== simulador ===== */
async function simView(){
 const [I,P,F]=await Promise.all([all('insumos'),all('produtos'),all('ficha_tecnica')]);
 const used=new Set(F.map(f=>f.insumo_id)),op=I.filter(i=>used.has(i.id)).sort((a,b)=>a.nome.localeCompare(b.nome)),I2=new Map(I.map(i=>[i.id,i])),PA=P.filter(p=>p.ativo!==false);
 $('#main').innerHTML=`<div class=ph><div><h2>Simulador</h2><p>E se um insumo ficar mais caro ou mais barato? Veja o efeito em cada receita antes de mexer nos preços.</p></div></div>
 <div class="card pad" style="margin-bottom:14px"><div class=sim><div class=fl><label>Insumo</label><select id=si><option value="*">Todos os insumos</option>${op.map(i=>`<option value="${i.id}">${esc(i.nome)}</option>`).join('')}</select></div>
 <div class=fl><label>Variação (%)</label><input id=sp type=number step=any value=10></div>
 <div class=fl id=snw style="display:none"><label>ou novo preço pago (R$)</label><input id=sn type=number step=any min=0 inputmode=decimal></div></div>
 <p class=hint>É só uma simulação — nada é alterado. Para valer, atualize o preço do insumo em <a href="#estoque" style="color:var(--p)">Insumos</a>.</p></div><div id=so></div>`;
 const run=()=>{const id=$('#si').value,f=1+num($('#sp').value)/100,adj=i=>id==='*'||i.id===id?f:1;
  const rows=PA.map(p=>{const a=custoIng(p,F,I2),b=custoIng(p,F,I2,adj),ex=num(p.custo_extra);return{p,a:a+ex,b:b+ex,ch:Math.abs(b-a)>1e-9}}).filter(x=>x.ch).sort((x,y)=>(y.b/y.a)-(x.b/x.a));
  $('#so').innerHTML=rows.length?`<div class="card tw"><table><thead><tr><th>Receita</th><th>Custo hoje</th><th>Custo novo</th><th>Margem hoje</th><th>Margem nova</th><th>Preço atual</th><th>Preço sugerido</th></tr></thead><tbody>${rows.map(({p,a,b})=>{const m1=margemDe(p.preco,a),m2=margemDe(p.preco,b),s=sugeridoDe(b,p.margem),pior=m2!=null&&m2<num(p.margem)-0.5;
   return `<tr><td>${esc(p.nome)}</td><td>${brl4(a)}</td><td>${brl4(b)} <small class=mute>(${b>=a?'+':''}${fmtN(Math.round((b/a-1)*1000)/10)}%)</small></td><td>${m1==null?'—':Math.round(m1)+'%'}</td><td>${m2==null?'—':`<span class="bd ${pior?'bad':'ok'}">${Math.round(m2)}%</span>`}</td><td>${brl(p.preco)}</td><td><b>${s?brl(s):'—'}</b></td></tr>`}).join('')}</tbody></table></div>`
   :`<div class="card empty">${ic('calc',40)}<p>Nenhuma receita usa esse insumo.</p></div>`};
 const sync=src=>{const i=I2.get($('#si').value),ok=!!i&&num(i.preco_embalagem)>0;$('#snw').style.display=ok?'':'none';
  if(ok){if(src==='n')$('#sp').value=Math.round((num($('#sn').value)/num(i.preco_embalagem)-1)*10000)/100;else $('#sn').value=Math.round(num(i.preco_embalagem)*(1+num($('#sp').value)/100)*100)/100}
  run()};
 $('#si').onchange=()=>sync('p');$('#sp').oninput=()=>sync('p');$('#sn').oninput=()=>sync('n');sync('p')}

 $('#main').onclick=e=>{const b=e.target.closest('[data-b]');if(!b)return;const x=rows[+b.dataset.b];

 const lc=$('#lc');if(lc){lc.onclick=async()=>{try{await navigator.clipboard.writeText(txt());toast('Lista copiada')}catch{toast('Não consegui copiar — use o botão do WhatsApp','bad')}};

/* ===== dashboard ===== */
function chart(vals,labs){const W=640,H=170,p=26,mx=Math.max(...vals,1),st=(W-2*p)/(vals.length-1),pts=vals.map((v,i)=>[p+i*st,H-p-(v/mx)*(H-2*p)]),
 line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
 return `<svg class=chart viewBox="0 0 ${W} ${H}"><defs><linearGradient id=g x1=0 x2=0 y1=0 y2=1><stop offset=0 style="stop-color:var(--p);stop-opacity:.28"/><stop offset=1 style="stop-color:var(--p);stop-opacity:0"/></linearGradient></defs><path d="${line}L${pts.at(-1)[0]} ${H-p}L${p} ${H-p}Z" fill="url(#g)"/><path d="${line}" fill=none style="stroke:var(--p)" stroke-width=2.5 stroke-linejoin=round />${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r=4 style="fill:var(--p)"><title>${labs[i]}: ${brl(vals[i])}</title></circle>`).join('')}${labs.map((l,i)=>i%2?'':`<text x="${pts[i][0]}" y="${H-6}" text-anchor=middle>${l}</text>`).join('')}</svg>`}
const grp=(a,k,f)=>Object.entries(a.reduce((o,x)=>(o[x[k]||'—']=(o[x[k]||'—']||0)+f(x),o),{})).sort((x,y)=>y[1]-x[1]);
const list2=(rows,empty='Sem dados no período')=>rows.length?rows.map(([a,b])=>`<div class=li><span>${a}</span><b>${b}</b></div>`).join(''):`<p class=mute>${empty}</p>`;
