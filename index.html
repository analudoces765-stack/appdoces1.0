<title>Doces da Analu - Cardápio</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f8f9fb;--card:#fff;--ink:#141a2b;--mut:#6b7280;--brand:#d81b60;--line:#e8e8ee;--pink:#fff;--red:#b42318;--redbg:#fdeceb;--green:#067647;--greenbg:#e7f6ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1d2029;--ink:#f3f3f6;--mut:#a0a4b0;--brand:#ff6b97;--line:#2c303c;--pink:#3a2a30;--redbg:#3a1f1d;--red:#ff9a90;--greenbg:#12301f;--green:#6ee7a0}}
*{box-sizing:border-box}html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Poppins,system-ui,sans-serif;max-width:560px;margin:auto;padding-bottom:90px}
.hero{height:170px;background:linear-gradient(#fde3ea,#fbeaee 70%,var(--bg));display:flex;align-items:center;justify-content:center;overflow:hidden}
.hero img{height:150px;mix-blend-mode:multiply}
.logo img{width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}
.info{background:var(--card);margin:-60px 14px 0;border-radius:28px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.1);position:relative}
.top{display:flex;gap:14px}
.logo{width:96px;height:96px;border-radius:50%;overflow:hidden;background:var(--pink);border:3px solid #fff;margin-top:-50px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:Georgia,serif;font-size:13px;color:#3a2a24;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.logo small{font-size:8px;letter-spacing:1px}
h1{margin:6px 0 8px;font-size:22px}
.st{display:inline-flex;gap:10px;align-items:center;padding:10px 16px;border-radius:30px;font-size:14px;font-weight:500;background:var(--redbg);color:var(--red)}
.st.open{background:var(--greenbg);color:var(--green)}.st i{width:8px;height:8px;border-radius:50%;background:currentColor}
.acts{display:flex;gap:12px;margin:14px 0 0 110px}
.acts a{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--ink);text-decoration:none;font-size:18px}
.meta{border-top:1px solid var(--line);margin-top:16px;padding-top:14px;color:var(--mut);font-size:14px;line-height:1.5}
.meta div{margin-bottom:8px}.row{display:flex;gap:22px;flex-wrap:wrap}
.tag{font-size:17px;margin:6px 0 0;color:var(--mut)}
nav{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 14px 10px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;height:44px;min-width:44px;padding:0 20px;border-radius:30px;border:1px solid var(--line);background:var(--card);color:var(--mut);font:500 16px Poppins,sans-serif;cursor:pointer}
nav button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
nav button:focus-visible,.add:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
h2{font-size:22px;margin:26px 18px 14px}
.item{position:relative;display:flex;background:var(--card);margin:0 14px 14px;border-radius:24px;min-height:110px;box-shadow:0 1px 4px rgba(0,0,0,.05);overflow:hidden}
.item .t{flex:1;padding:16px 14px 14px 20px;min-width:0}
.item h3{margin:0 0 6px;font-size:17px;line-height:1.25}
.item p{margin:0 0 8px;font-size:14px;color:var(--mut);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pr{font-weight:700;color:var(--brand);font-size:17px}
.img{width:30%;min-width:110px;flex:none;display:grid;place-items:center;font-size:44px}
.add{position:absolute;right:12px;top:12px;width:42px;height:42px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:24px;cursor:pointer;display:grid;place-items:center}
.combo .add{top:auto;bottom:auto;top:14px}
.qty{background:var(--brand);color:#fff;border-radius:22px;width:auto;padding:0 12px;font:600 15px Poppins;gap:10px}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:calc(100% - 28px);max-width:532px;background:var(--brand);color:#fff;border:0;border-radius:30px;padding:16px 22px;display:none;justify-content:space-between;font:600 16px Poppins;cursor:pointer;z-index:9}
.bar.show{display:flex}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.show{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:22px;max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:20px}
.ln{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px;gap:10px}
.ln .c{display:flex;gap:8px;align-items:center}.ln .c button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:none;color:var(--ink);font-size:18px;cursor:pointer}
.sheet input{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;margin-top:10px;font:15px Poppins;background:var(--bg);color:var(--ink)}
.tot{display:flex;justify-content:space-between;font-size:15px;padding:4px 0;color:var(--mut)}.tot.g{color:var(--ink);font-weight:700;font-size:18px}
.go{width:100%;margin-top:14px;padding:15px;border:0;border-radius:30px;background:#1fa855;color:#fff;font:600 16px Poppins;cursor:pointer}
.go:disabled{opacity:.5}.warn{color:var(--red);font-size:13px;margin-top:8px}
</style></head><body>

const cart={};const $=s=>document.querySelector(s);
const R=v=>"R$ "+v.toFixed(2).replace(".",",");
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const h=new Date().getHours();const isOpen=h>=OPEN&&h<CLOSE;
$("#st").classList.toggle("open",isOpen);
$("#stt").textContent=isOpen?"Aberto · fecha às "+CLOSE+":00":(h<OPEN?"Fechado · abre hoje às "+OPEN+":00":"Fechado · abre amanhã às "+OPEN+":00");
$("#wa").href="https://wa.me/"+WHATS;
$("#nav").innerHTML='<button aria-label="Menu">☰</button><button aria-label="Buscar" id="sb">🔍</button>'+cats.map((c,i)=>`<button data-i="${i}">${c.n}</button>`).join("");
$("#menu").innerHTML=cats.map((c,i)=>`<h2 id="c${i}">${c.n}</h2>`+c.items.map((it,j)=>`<div class="item ${c.combo?"combo":""}"><div class="t"><h3>${esc(it[0])}</h3><p>${esc(it[1])}</p><div class="pr">${R(it[2])}</div></div><div class="img" style="background:${["#f3e6e0","#efd9cf","#e6d0c4"][i%3]}">${it[3]}</div><button class="add" data-k="${i}-${j}" aria-label="Adicionar ${esc(it[0])}">+</button></div>`).join("")).join("");
const find=k=>{const[a,b]=k.split("-");return cats[a].items[b]};
function paint(){document.querySelectorAll(".add").forEach(b=>{const q=cart[b.dataset.k]||0;b.className="add"+(q?" qty":"");b.innerHTML=q?`<span data-m="${b.dataset.k}">−</span>${q}<span data-p="${b.dataset.k}">+</span>`:"+"});
 let n=0,t=0;for(const k in cart){n+=cart[k];t+=cart[k]*find(k)[2]}
 $("#bar").classList.toggle("show",n>0);$("#bc").textContent="🛒 Ver sacola ("+n+(n==1?" item)":" itens)");$("#bt").textContent=R(t);return[n,t]}
$("#menu").addEventListener("click",e=>{const b=e.target.closest(".add");if(!b)return;const k=b.dataset.k;
 if(e.target.dataset.m){cart[k]--;if(!cart[k])delete cart[k]}else cart[k]=(cart[k]||0)+1;paint()});
$("#nav").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
 if(b.id=="sb"){const q=prompt("Buscar no cardápio:");if(q){const x=[...document.querySelectorAll(".item")].find(i=>i.textContent.toLowerCase().includes(q.toLowerCase()));x?x.scrollIntoView({behavior:"smooth",block:"center"}):alert("Nada encontrado")}return}
 if(b.dataset.i!=null)document.getElementById("c"+b.dataset.i).scrollIntoView({behavior:"smooth"})});
addEventListener("scroll",()=>{let a=-1;cats.forEach((_,i)=>{if(document.getElementById("c"+i).getBoundingClientRect().top<120)a=i});
 document.querySelectorAll("nav [data-i]").forEach(b=>b.classList.toggle("on",+b.dataset.i===a))});
function sheet(){const[n,t]=paint();const tot=t+FEE;
 $("#sh").innerHTML=`<h3>Sua sacola</h3>`+Object.keys(cart).map(k=>`<div class="ln"><span>${esc(find(k)[0])}<br><b>${R(find(k)[2]*cart[k])}</b></span><span class="c"><button data-m="${k}">−</button>${cart[k]}<button data-p="${k}">+</button></span></div>`).join("")+
 `<input id="nm" placeholder="Seu nome"><input id="ad" placeholder="Endereço de entrega"><div style="height:10px"></div>
 <div class="tot"><span>Subtotal</span><span>${R(t)}</span></div><div class="tot"><span>Entrega</span><span>${R(FEE)}</span></div><div class="tot g"><span>Total</span><span>${R(tot)}</span></div>
 ${t<MIN?`<div class="warn">Pedido mínimo de ${R(MIN)}.</div>`:""}<button class="go" id="go" ${t<MIN?"disabled":""}>Enviar pedido pelo WhatsApp</button>`}
$("#bar").onclick=()=>{sheet();$("#md").classList.add("show")};
$("#md").addEventListener("click",e=>{if(e.target.id=="md"){$("#md").classList.remove("show");return}
