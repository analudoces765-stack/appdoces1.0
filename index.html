async function boot(){

 $('#q',el).oninput=draw;draw();

async function editRow(tb,r){
 const d=T[tb];await loadRefs(d);const vals={...(r||{})},L=d.f.find(f=>f[2]==='lines');

 form({title:(r?'Editar ':'Novo ')+(d.one||d.t),fields:d.f.filter(f=>!(f[4]||'').includes('ro')),vals,save:async v=>{

/* ===== formulários (drawer) ===== */
function inp(f,v,lc){const [k,l,t,o]=f,val=v??'';
 if(t==='select')return `<select name="${k}">${o.map(x=>`<option ${x===val?'selected':''}>${x}</option>`).join('')}</select>`;
 if(t==='ref')return `<select name="${k}"><option value="">Selecione…</option>${(cache[o[0]]||[]).filter(x=>x.ativo!==false).map(x=>`<option value="${x.id}" ${x.id===val?'selected':''}>${esc(optLabel(o[0],x,o[1]))}</option>`).join('')}</select>`;
 if(t==='area')return `<textarea name="${k}" rows=3>${esc(val)}</textarea>`;
 if(t==='bool')return `<label class=ck><input type=checkbox name="${k}" ${v==null||v?'checked':''}> ${l}</label>`;
 const ty={money:'number',number:'number',date:'date',color:'color'}[t]||'text';
 return `<input name="${k}" type=${ty} ${ty==='number'?'step=any min=0 inputmode=decimal':''} value="${esc(val)}" ${lc?`placeholder="${l}"`:''}>`}
const ln=(f,r)=>`<div class=ln>${f[3].cols.map(c=>inp(c,r[c[0]],1)).join('')}<button type=button class=ib data-rm>${ic('x',16)}</button></div>`;
function fld(f,v){const [k,l,t,o,fl='']=f;
 if(t==='lines')return `<div class=fl><label>${l}</label><div class=lines data-l="${k}">${(v?.length?v:[{...(o.def||{})}]).map(r=>ln(f,r)).join('')}</div><button type=button class=btn-o data-add="${k}">${ic('plus',16)} Adicionar linha</button></div>`;
 if(t==='date'&&v==null&&fl.includes('today'))v=today();
 return `<div class=fl>${t==='bool'?'':`<label>${l}${fl.includes('req')?' *':''}</label>`}${inp(f,v)}</div>`}
function collect(root,fields){const o={};for(const [k,,t,op] of fields){
 if(t==='lines'){const fc=op.cols[0][0];o[k]=[...root.querySelectorAll(`[data-l="${k}"] .ln`)].map(r=>Object.fromEntries(op.cols.map(c=>{const e=r.querySelector(`[name="${c[0]}"]`);return [c[0],c[2]==='number'?num(e.value):e.value]}))).filter(x=>x[fc]);continue}
 const e=root.querySelector(`[name="${k}"]`);if(!e)continue;
 o[k]=t==='bool'?e.checked:(t==='number'||t==='money')?num(e.value):(e.value===''?null:e.value)}return o}
function open_(title,html){$('#dr').innerHTML=`<div class=dh><h3>${title}</h3><button class=ib id=dx>${ic('x')}</button></div>${html}`;document.body.classList.add('dr-open');

function form({title,fields,vals={},save,btn='Salvar',foot='',onInput}){
 const close=open_(title,`<form id=fm><div class=db>${fields.map(f=>fld(f,vals[f[0]])).join('')}</div><div class=df>${foot}<button type=button class=btn-o id=dc>Cancelar</button><button class=btn id=ds>${btn}</button></div></form>`);
 const fm=$('#fm');$('#dc').onclick=close;
 if(onInput){fm.oninput=fm.onchange=()=>onInput(fm);onInput(fm)}

  for(const f of fields)if((f[4]||'').includes('req')&&(v[f[0]]==null||v[f[0]]===''))return toast(f[1]+' é obrigatório','bad');
  const b=$('#ds');b.disabled=true;const ok=await save(v);b.disabled=false;if(ok){close();toast('Salvo com sucesso');cache={};go(route)}}}

 const w=window.open('','_blank','width=380,height=640');if(!w)return toast('Libere pop-ups para imprimir','bad');

/* ===== dashboard ===== */
function chart(vals,labs){const W=640,H=170,p=26,mx=Math.max(...vals,1),st=(W-2*p)/(vals.length-1),pts=vals.map((v,i)=>[p+i*st,H-p-(v/mx)*(H-2*p)]),
 line=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join('');
 return `<svg class=chart viewBox="0 0 ${W} ${H}"><defs><linearGradient id=g x1=0 x2=0 y1=0 y2=1><stop offset=0 style="stop-color:var(--p);stop-opacity:.28"/><stop offset=1 style="stop-color:var(--p);stop-opacity:0"/></linearGradient></defs><path d="${line}L${pts.at(-1)[0]} ${H-p}L${p} ${H-p}Z" fill="url(#g)"/><path d="${line}" fill=none style="stroke:var(--p)" stroke-width=2.5 stroke-linejoin=round />${pts.map((q,i)=>`<circle cx="${q[0]}" cy="${q[1]}" r=4 style="fill:var(--p)"><title>${labs[i]}: ${brl(vals[i])}</title></circle>`).join('')}${labs.map((l,i)=>i%2?'':`<text x="${pts[i][0]}" y="${H-6}" text-anchor=middle>${l}</text>`).join('')}</svg>`}
const grp=(a,k,f)=>Object.entries(a.reduce((o,x)=>(o[x[k]||'—']=(o[x[k]||'—']||0)+f(x),o),{})).sort((x,y)=>y[1]-x[1]);
const list2=(rows,empty='Sem dados no período')=>rows.length?rows.map(([a,b])=>`<div class=li><span>${a}</span><b>${b}</b></div>`).join(''):`<p class=mute>${empty}</p>`;
async function dash(){
 const fin=['Admin','Gerente'].includes(me.nivel),since=new Date(Date.now()-29*864e5).toISOString();
 const [V,E,F,I,P,IT]=await Promise.all([
  sb.from('vendas').select('*').gte('created_at',since).neq('status','Cancelada'),
  sb.from('encomendas').select('*').not('status','in','(Entregue,Cancelado)').order('data_entrega'),
  sb.from('financeiro').select('*').eq('status','Pendente'),sb.from('insumos').select('*'),sb.from('produtos').select('*'),
  sb.from('venda_itens').select('produto_id,produto_nome,quantidade,preco,vendas!inner(created_at,status)').gte('vendas.created_at',since).neq('vendas.status','Cancelada')].map(q=>q.then(r=>r.data||[])));
 await loadRefs({f:[['x','','ref',['clientes','nome']]]});
 const t0=today(),mes=t0.slice(0,7),sv=f=>V.filter(f).reduce((a,v)=>a+num(v.total),0);
 const hoje=sv(v=>day(v.created_at)===t0),ontem=sv(v=>day(v.created_at)===dd(1)),dl_=ontem?Math.round((hoje/ontem-1)*100):null;
 const days=[...Array(14)].map((_,i)=>dd(13-i)),vals=days.map(d=>sv(v=>day(v.created_at)===d)),fm=sv(v=>day(v.created_at).startsWith(mes)),nm=V.filter(v=>day(v.created_at).startsWith(mes)).length;
 const itM=IT.filter(i=>day(i.vendas.created_at).startsWith(mes)),custo=itM.reduce((a,i)=>a+num(i.quantidade)*num(P.find(p=>p.id===i.produto_id)?.custo),0);
 const top=grp(itM,'produto_nome',i=>num(i.quantidade)).slice(0,5),low=I.filter(i=>num(i.quantidade)<=num(i.minimo));
 const pend=tp=>F.filter(f=>tp.includes(f.tipo)).reduce((a,f)=>a+num(f.valor),0);
 $('#main').innerHTML=`<div class=kpis>
  ${kpi('Vendas hoje','cart',brl(hoje),dl_==null?'':`<em style="color:var(--${dl_>=0?'ok':'ba'})">${dl_>=0?'▲':'▼'} ${Math.abs(dl_)}%</em>`)}
  ${kpi('Faturamento do mês','trend',brl(fm))}${kpi('Lucro bruto do mês','chart',brl(fm-custo))}${kpi('Ticket médio','receipt',brl(nm?fm/nm:0))}
  ${kpi('Encomendas abertas','cake',E.length)}${fin?kpi('A receber','clock',brl(pend(['Receber','Receita'])))+kpi('A pagar','wallet',brl(pend(['Pagar','Despesa']))):''}${kpi('Estoque baixo','alert',low.length)}</div>
 <div class=g2><div class="card pad" style="grid-column:span 2;min-width:0"><h3>Vendas — últimos 14 dias</h3>${chart(vals,days.map(d=>d.slice(8)+'/'+d.slice(5,7)))}</div></div>
 <div class=g2><div class="card pad"><h3>Próximas entregas</h3>${list2(E.slice(0,6).map(e=>[`${dt(e.data_entrega)} · ${esc(refName(['clientes','nome'],e.cliente_id)==='—'?(e.descricao||'').slice(0,28):refName(['clientes','nome'],e.cliente_id))}`,badge(e.status)]),'Nenhuma encomenda aberta')}</div>
 <div class="card pad"><h3>Mais vendidos no mês</h3>${list2(top.map(([a,b])=>[esc(a),fmtN(b)+' un']))}</div>
 <div class="card pad"><h3>Reposição de estoque</h3>${list2(low.slice(0,6).map(i=>[esc(i.nome),`<span class="bd bad">${fmtN(i.quantidade)} / mín ${fmtN(i.minimo)} ${i.unidade}</span>`]),'Tudo em dia ✅')}</div></div>`}

/* ===== relatórios ===== */
async function rel(n=30){
 const since=new Date(Date.now()-n*864e5).toISOString(),sd=since.slice(0,10);
 const [V,IT,C,O,I,P]=await Promise.all([
  sb.from('vendas').select('*').gte('created_at',since).neq('status','Cancelada'),
  sb.from('venda_itens').select('produto_id,produto_nome,quantidade,preco,vendas!inner(created_at,status)').gte('vendas.created_at',since).neq('vendas.status','Cancelada'),
  sb.from('compras').select('*').gte('data',sd).neq('status','Cancelada'),sb.from('ordens_producao').select('*').gte('data',sd).eq('status','Concluída'),
  sb.from('insumos').select('*'),sb.from('produtos').select('*')].map(q=>q.then(r=>r.data||[])));
 await loadRefs({f:[['x','','ref',['fornecedores','nome']]]});
 const fat=V.reduce((a,v)=>a+num(v.total),0),custo=IT.reduce((a,i)=>a+num(i.quantidade)*num(P.find(p=>p.id===i.produto_id)?.custo),0),pn=id=>P.find(p=>p.id===id)?.nome||'—';
 $('#main').innerHTML=`<div class=ph><div><h2>Desempenho do negócio</h2><p>Indicadores do período selecionado</p></div><div class=tools><select id=per style="width:auto"><option value=7>Últimos 7 dias</option><option value=30>Últimos 30 dias</option><option value=90>Últimos 90 dias</option></select><button class=btn-o id=ex>${ic('download',16)} Exportar vendas</button></div></div>
 <div class=kpis>${kpi('Faturamento','trend',brl(fat))}${kpi('Vendas','cart',V.length)}${kpi('Ticket médio','receipt',brl(V.length?fat/V.length:0))}${kpi('Lucro bruto','chart',brl(fat-custo))}${kpi('Margem','alert',(fat?Math.round((fat-custo)/fat*100):0)+'%')}</div>
 <div class=g2><div class="card pad"><h3>Produtos mais vendidos</h3>${list2(grp(IT,'produto_nome',i=>num(i.quantidade)).slice(0,8).map(([a,b])=>[esc(a),fmtN(b)+' un']))}</div>
 <div class="card pad"><h3>Vendas por forma de pagamento</h3>${list2(grp(V,'forma_pagamento',v=>num(v.total)).map(([a,b])=>[esc(a),brl(b)]))}</div>
 <div class="card pad"><h3>Compras por fornecedor</h3>${list2(grp(C.map(c=>({...c,f:refName(['fornecedores','nome'],c.fornecedor_id)})),'f',c=>num(c.valor)).map(([a,b])=>[esc(a),brl(b)]))}</div>
 <div class="card pad"><h3>Produção concluída</h3>${list2(grp(O.map(o=>({...o,p:pn(o.produto_id)})),'p',o=>num(o.quantidade)).map(([a,b])=>[esc(a),fmtN(b)+' un']))}</div>
 <div class="card pad"><h3>Estoque crítico</h3>${list2(I.filter(i=>num(i.quantidade)<=num(i.minimo)).map(i=>[esc(i.nome),`${fmtN(i.quantidade)} ${i.unidade}`]),'Nenhum item crítico')}</div></div>`;
 $('#per').value=n;$('#per').onchange=e=>rel(+e.target.value);$('#ex').onclick=()=>V.length&&csv(V,'vendas');}

if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
